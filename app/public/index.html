<!DOCTYPE html>
<!--
  ブラウザで開いたときの土台。

  web.output が "single" のとき、expo はこのファイルを雛形として使う。
  （"static" の場合は src/app/+html.tsx が使われるが、この構成では
    単一ページのほうが offline との相性がよいため single にしている。）

  manifest と Service Worker の指定は、この層にしか置けない。
-->
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!--
      拡大を止めない（2026-09-12）。

      以前は user-scalable=no を付けていた。走行前に片手で扱うため、
      二本指で画面が崩れないように、という意図だった。

      **止めたままにしてはいけない。**
        * 乗務員は50〜70代が中心で、小さい字を拡大して読む方がいる。
          その手立てを奪うことになる
        * 文字の拡大は WCAG 1.4.4 で 200% まで求められている
        * iOS 10 以降の Safari はこの指定を無視する。**止まるのは
          Android だけ**で、端末によって振る舞いが割れていた
        * 何かの拍子に小さく出たとき、利用者に逃げ道が無くなる

      viewport-fit=cover は残す。切り欠きのある端末で、地の色を
      端まで届かせるために要る。
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!--
      検索と共有のための頭の情報（2026-11-24、ご指示「アプリと紹介サイトの両方を検索に」）。

      **紹介サイトと役目を分ける。** 紹介サイト（kurumayosenavi.com）は「サービスの説明」、
      アプリは「使い始める入口」。同じ題・同じ説明にすると、「車寄せナビ」で探したときに
      2つが取り合いになる。アプリの題には「アプリ」、説明には「ログイン・新規登録」を入れる。

      **検索に出すのはトップ（/）だけ。** この構成は1枚の html を全部の住所で返し、ログイン
      していなければどの住所でも入口（ログイン・新規登録）が出る。/facility/… や /mypage を
      載せても中身は同じ入口になるため、トップ以外は vercel.json で検索に載せない
      （X-Robots-Tag）。正規の住所もトップにそろえる。

      題は、ログインしたあとのブラウザのタブにもこのまま出る。どちらの状態でもおかしくない
      言い方にしてある（「ログイン」は題に入れず、説明にだけ入れる）。
      ホーム画面に置いたときの名前は、下の apple-mobile-web-app-title と manifest の
      「車寄せナビ」のまま。
    -->
    <title>車寄せナビ アプリ｜プロドライバーのための車寄せ・エントランス案内</title>
    <meta
      name="description"
      content="プロドライバーのための車寄せ・エントランス案内アプリ「車寄せナビ」のログイン・新規登録の入口です。インストール不要で、スマートフォンのブラウザから使えます。試験提供中は無料。"
    />
    <link rel="canonical" href="https://app.kurumayosenavi.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="車寄せナビ" />
    <meta property="og:title" content="車寄せナビ アプリ｜プロドライバーのための車寄せ・エントランス案内" />
    <meta
      property="og:description"
      content="プロドライバーのための車寄せ・エントランス案内アプリ。インストール不要で、スマートフォンのブラウザから使えます。試験提供中は無料。"
    />
    <meta property="og:url" content="https://app.kurumayosenavi.com/" />
    <!-- 共有の画像は紹介サイトと同じもの。SNS や LINE は住所から始まる形でないと読まない -->
    <meta property="og:image" content="https://kurumayosenavi.com/assets/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      検索の仕組みに、これが何のアプリで、誰が出しているかを伝える（schema.org）。
      料金（offers）は書かない。試験提供のあいだと有料のあとで変わり、書き換え忘れると
      検索結果に古い値段が出るため。
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "車寄せナビ",
        "alternateName": "Driver Entrance Navi",
        "url": "https://app.kurumayosenavi.com/",
        "description": "プロドライバーのための車寄せ・エントランス案内アプリ。施設の車寄せや入口の場所、入り方を案内し、Google マップなどのナビへ目的地を渡します。",
        "applicationCategory": "TravelApplication",
        "operatingSystem": "iOS, Android（ブラウザで動作）",
        "browserRequirements": "Safari、Google Chrome、Microsoft Edge の最新版",
        "inLanguage": "ja",
        "image": "https://app.kurumayosenavi.com/icons/icon-512.png",
        "publisher": {
          "@type": "Organization",
          "name": "レベルサーフェス",
          "url": "https://kurumayosenavi.com/",
          "email": "kurumayose@levelsurface.net"
        },
        "sameAs": ["https://kurumayosenavi.com/"]
      }
    </script>

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0B192F" />

    <!--
      iPhone 向け。Safari は manifest だけでは足りず、こちらを見る。
      ホーム画面へ追加していただくと、保存データが消えにくくなる。
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="車寄せナビ" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />

    <!--
      検索結果に出るアイコン。Google はトップに書いたアイコンを使い、48×48 より大きいものを勧めている。
      Expo が足す /favicon.ico は最大 48×48 なので、192×192（48 の倍数）をこちらで指す。
      vercel.json で、アイコンには「検索に載せない」の見出しを付けていない。
    -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <style id="expo-reset">
      /* 画面いっぱいに広げる */
      html, body { height: 100%; }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; }

      /*
        地色。読み込みの一瞬だけ白が出るのを防ぐ。
        夜間の車内で白い画面が出ると、目が眩む。
      */
      html, body, #root { background-color: #0B192F; }

      /*
        見出しに使う丸ゴシック（Zen Maru Gothic）。

        「行きたい場所を見つけよう」の12文字だけを取り出して持っている
        （tools/build-font.mjs が作る 2.8KB）。日本語の書体は全文字を
        持つと数MBあり、見出し1行のために配る量ではない。

        自前で配るのは、圏外でも同じ見た目にするため。外部から読む作りだと、
        電波の届かない場所で既定の書体に戻ってしまう。

        swap にしているのは、読み込みを待って文字が消える時間を作らないため。
        先に既定の書体で出し、届いたら差し替える。
      */
      @font-face {
        font-family: 'Kurumayose Heading';
        src: url('/fonts/zen-maru-gothic-heading.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <script>
      // 電波が無くても開けるようにする常駐処理
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {
            // 登録できなくても、通信できる場所では動く
          });
        });
      }
    </script>
  </body>
</html>
