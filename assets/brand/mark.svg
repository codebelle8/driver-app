<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="220" height="260">

  <!-- ピン（しずく形）: 目的地を示す -->
  <path
    d="M110 252 C 70 200, 15 168, 15 105 A 95 95 0 1 1 205 105 C 205 168, 150 200, 110 252 Z"
    fill="#1A2F4A" />

  <!-- 目的地ピン（橙）: 「ここが目的地」 -->
  <path
    d="M110 101 C 101 89, 89 81, 89 67 A 21 21 0 1 1 131 67 C 131 81, 119 89, 110 101 Z"
    fill="#F5A623" />
  <circle cx="110" cy="66" r="7.5" fill="#FFFFFF" />

  <!-- 車寄せの屋根（キャノピー）: 正面玄関の庇 -->
  <path
    d="M46 164 V143 C 46 112, 174 112, 174 143 V164"
    fill="none" stroke="#FFFFFF" stroke-width="10"
    stroke-linecap="round" stroke-linejoin="round" />
  <path d="M57 150 H163" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" />

  <!-- 車（正面）: 車寄せに着けた状態 -->
  <path d="M83 169 L91 156 H129 L137 169 Z" fill="#FFFFFF" />
  <rect x="70" y="167" width="80" height="19" rx="7" fill="#FFFFFF" />
  <!-- ヘッドライト -->
  <rect x="75" y="173" width="12" height="6.5" rx="3.25" fill="#F5A623" />
  <rect x="133" y="173" width="12" height="6.5" rx="3.25" fill="#F5A623" />
  <!-- タイヤ -->
  <circle cx="87" cy="189" r="6.5" fill="#1A2F4A" stroke="#FFFFFF" stroke-width="3" />
  <circle cx="133" cy="189" r="6.5" fill="#1A2F4A" stroke="#FFFFFF" stroke-width="3" />

  <!-- ナビ矢印（水色）: 正確な到着へ導く -->
  <path d="M110 197 L125 226 L110 218 L95 226 Z" fill="#00B8C6" />
  <path d="M110 232 V241" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />

</svg>